<!doctype html>
<html lang="en-IN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#121214">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Order Desk">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<link rel="icon" type="image/png" href="/icons/icon-192.png">
<title>Sign in · Order Desk</title>
<style>
:root{--ink:#121214;--ink2:#2A2A2E;--hi:#FFD43B;--muted:#9A9A94;--bad:#FF6B5E;--ui:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif}
*{box-sizing:border-box}html,body{margin:0;height:100%}
body{background:var(--ink);color:#fff;font-family:var(--ui);-webkit-font-smoothing:antialiased;display:flex;align-items:center;justify-content:center;
  padding:max(24px,env(safe-area-inset-top)) max(20px,env(safe-area-inset-right)) max(24px,env(safe-area-inset-bottom)) max(20px,env(safe-area-inset-left))}
.box{width:100%;max-width:380px;text-align:center}
.icon{width:84px;height:84px;border-radius:20px;display:block;margin:0 auto 18px;box-shadow:0 10px 30px rgba(0,0,0,.45)}
h1{font-size:1.7rem;font-weight:800;letter-spacing:.02em;margin:0}
h1 b{color:var(--hi)}
.sub{color:var(--muted);margin:6px 0 30px;font-size:.95rem}
label{display:block;text-align:left;font-size:.8rem;font-weight:700;color:var(--muted);margin:0 0 8px 4px;text-transform:uppercase;letter-spacing:.06em}
.field{position:relative}
input{width:100%;font:inherit;font-size:1.1rem;padding:16px 56px 16px 16px;border-radius:14px;border:1.5px solid #3A3A40;background:var(--ink2);color:#fff;outline:none;-webkit-appearance:none}
input:focus{border-color:var(--hi)}
.eye{position:absolute;right:8px;top:50%;transform:translateY(-50%);background:none;border:0;color:var(--muted);font-size:.85rem;font-weight:700;padding:10px}
button.go{width:100%;margin-top:16px;padding:16px;border:0;border-radius:14px;background:var(--hi);color:var(--ink);font:inherit;font-size:1.05rem;font-weight:800}
button.go:active{transform:scale(.98)}
button.go[disabled]{opacity:.6}
.err{color:var(--bad);font-weight:700;min-height:1.4em;margin:14px 0 0}
.note{color:var(--muted);font-size:.82rem;margin-top:26px;line-height:1.5}
</style>
</head>
<body>
<main class="box">
  <img class="icon" src="/icons/icon-192.png" alt="">
  <h1>ORDER<b>DESK</b></h1>
  <p class="sub">Beauty Mart · private</p>
  <form id="f" autocomplete="on">
    <input type="text" name="username" value="admin" autocomplete="username" hidden>
    <label for="pw">Password</label>
    <div class="field"><input id="pw" name="password" type="password" autocomplete="current-password" required autofocus><button class="eye" type="button" id="eye">Show</button></div>
    <button class="go" id="go" type="submit">Sign in</button>
    <p class="err" id="err" role="alert"></p>
  </form>
  <p class="note">You stay signed in on this device for 6 months.<br>Add to Home Screen to use it like an app.</p>
</main>
<script>
var f=document.getElementById("f"),pw=document.getElementById("pw"),err=document.getElementById("err"),go=document.getElementById("go");
document.getElementById("eye").onclick=function(){var s=pw.type==="password";pw.type=s?"text":"password";this.textContent=s?"Hide":"Show";pw.focus();};
f.onsubmit=function(e){e.preventDefault();err.textContent="";go.disabled=true;go.textContent="Signing in…";
  fetch("/api/login",{method:"POST",headers:{"Content-Type":"application/json"},credentials:"same-origin",body:JSON.stringify({password:pw.value})})
  .then(function(r){return r.json().then(function(j){return {ok:r.ok,j:j};});})
  .then(function(x){if(x.ok&&x.j.ok){var n=new URLSearchParams(location.search).get("next")||"/";if(!/^\/(?!\/)/.test(n))n="/";location.replace(n);}
    else{err.textContent=(x.j&&x.j.error)||"Could not sign in";go.disabled=false;go.textContent="Sign in";pw.select();}})
  .catch(function(){err.textContent="No internet connection. Please try again.";go.disabled=false;go.textContent="Sign in";});
};
</script>
</body>
</html>
