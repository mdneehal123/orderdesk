name: Find free skincare photos (Unsplash)
on:
  push:
    branches: [mg-photos]
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Search Unsplash and save free candidates
        run: |
          python3 - <<'PY'
          import json, urllib.request, urllib.parse, os
          qs = ["indian woman skincare","indian woman face cream","indian woman washing face","indian woman applying cream","woman applying face cream brown skin",
                "woman applying sunscreen face","woman night skincare routine","woman removing makeup cotton pad","woman sleeping peacefully","indian woman glowing skin portrait",
                "south asian woman skincare","woman moisturizer face mirror"]
          H = {"User-Agent": "Mozilla/5.0", "Accept": "application/json"}
          seen, keep = set(), []
          os.makedirs("cand", exist_ok=True)
          for q in qs:
              for page in (1, 2):
                  u = "https://unsplash.com/napi/search/photos?" + urllib.parse.urlencode({"query": q, "per_page": 30, "page": page})
                  try: d = json.load(urllib.request.urlopen(urllib.request.Request(u, headers=H), timeout=30))
                  except Exception as e: print("search failed", q, e); continue
                  for r in d.get("results", []):
                      if r["id"] in seen or r.get("premium") or r.get("plus"): continue
                      seen.add(r["id"])
                      keep.append({"id": r["id"], "q": q, "w": r["width"], "h": r["height"], "alt": r.get("alt_description"), "desc": r.get("description"),
                                   "by": r["user"]["name"], "page": r["links"]["html"], "raw": r["urls"]["raw"]})
          print("free candidates:", len(keep))
          for i, k in enumerate(keep):
              try:
                  urllib.request.urlretrieve(k["raw"] + "&w=360&q=60&fm=jpg", f"cand/{i:03d}_{k['id']}.jpg")
              except Exception as e: print("thumb failed", k["id"], e)
          json.dump(keep, open("cand/index.json", "w"), indent=1)
          PY
      - name: Save
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cand && git commit -m "Free photo candidates" && git push
