name: Copy routine photos to look at
on:
  push:
    branches: [mg-photos]
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir -p yf
          for f in youth-face-routine-apply-cream.jpg youth-face-routine-pat-dry.jpg youth-face-routine-cleanse.jpg anti-aging-routine-30s.jpg oily-skin-routine-india.jpg; do
            curl -fsSL -A "Mozilla/5.0" "https://youthfacebeauty.com/wp-content/uploads/2026/09/$f" -o "yf/$f" || echo "failed $f"
          done
          git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add yf && git commit -m "Youth Face routine photos" && git push
