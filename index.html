<!doctype html>
<html lang="en-IN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#121214">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Order Desk">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<title>Order Desk</title>
<link rel="icon" type="image/png" href="/icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@500;700;800&display=swap">
<link rel="stylesheet" href="app.css">
<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js" defer></script>
<script src="app.js" defer></script>
</head>
<body>
<div id="lock" class="lock" hidden>
  <form id="lockform" class="lockbox">
    <div class="logo">ORDER<b>DESK</b></div>
    <label for="lockpin">Enter PIN</label>
    <input id="lockpin" type="password" inputmode="numeric" autocomplete="current-password" maxlength="8">
    <button class="btn primary" type="submit">Unlock</button>
    <p class="err" id="lockerr" hidden>Wrong PIN. Try again.</p>
  </form>
</div>

<div id="app" class="app">
  <header class="bar">
    <a class="logo" href="#dashboard">ORDER<b>DESK</b></a>
    <label class="brandpick"><span class="dot" id="branddot"></span><select id="brandsel" aria-label="Brand"></select></label>
    <nav class="nav" id="nav" aria-label="Sections">
      <a href="#dashboard" data-r="dashboard">Today</a>
      <a href="#new" data-r="new">New order</a>
      <a href="#orders" data-r="orders">Orders</a>
      <a href="#dispatch" data-r="dispatch">Dispatch</a>
      <a href="#scan" data-r="scan">Scan</a>
      <a href="#customers" data-r="customers">Customers</a>
      <a href="#reports" data-r="reports">Reports</a>
      <a href="#settings" data-r="settings">Settings</a>
    </nav>
    <button class="sync" id="syncbtn" type="button" title="Sync online"><span class="sd" id="syncdot"></span><span id="synctxt">Local</span></button>
  </header>
  <main id="view" class="view" tabindex="-1"></main>

  <!-- iPhone-style bottom tab bar (phones and small tablets) -->
  <nav class="tabbar" id="tabbar" aria-label="Main">
    <a href="#dashboard" data-r="dashboard"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg><span>Today</span></a>
    <a href="#orders" data-r="orders"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7.5 12 3l8 4.5v9L12 21l-8-4.5zM4 7.5l8 4.5 8-4.5M12 12v9"/></svg><span>Orders</span></a>
    <a href="#new" data-r="new" class="tab-new"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg><span>New</span></a>
    <a href="#dispatch" data-r="dispatch"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 6h11v10H3zM14 9h4l3 3.5V16h-7M7.5 19.5a1.5 1.5 0 1 0 0-3 1.5 1.5 0 0 0 0 3zM17.5 19.5a1.5 1.5 0 1 0 0-3 1.5 1.5 0 0 0 0 3z"/></svg><span>Dispatch</span></a>
    <button type="button" id="moreBtn" data-r="more" aria-haspopup="true" aria-expanded="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h.01M12 12h.01M19 12h.01"/></svg><span>More</span></button>
  </nav>
  <div class="sheet-bg" id="sheetBg" hidden></div>
  <div class="sheet" id="moreSheet" role="menu" hidden>
    <div class="sheet-grip"></div>
    <a href="#scan" data-r="scan" role="menuitem"><span class="si">📷</span>Scan</a>
    <a href="#customers" data-r="customers" role="menuitem"><span class="si">👥</span>Customers</a>
    <a href="#reports" data-r="reports" role="menuitem"><span class="si">📊</span>Reports</a>
    <a href="#settings" data-r="settings" role="menuitem"><span class="si">⚙️</span>Settings</a>
    <button type="button" id="logoutBtn" role="menuitem"><span class="si">🔒</span>Sign out</button>
  </div>
</div>

<div id="print" class="print" aria-hidden="true"></div>
<div id="toast" class="toast" role="status" hidden></div>
</body>
</html>
